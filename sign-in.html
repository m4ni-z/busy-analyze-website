<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="icon" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      font-family: sans-serif;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Navbar Styles */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      z-index: 10;
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      gap: 20px;
    }

    #navbar .nav-logo {
      height: 50px;
      width: auto;
      flex-shrink: 0;
    }

    .nav-item {
      text-decoration: none;
    }

    .nav-item .btn, .btn.nav-item {
      max-width: 40px;
      height: 50px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: none;
      background-color: transparent;
      transition: max-width 0.4s ease;
      white-space: nowrap;
    }

    .nav-item .btn img, .btn.nav-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .nav-item .btn-text, .btn.nav-item .btn-text {
      opacity: 0;
      color: #f2c915;
      font-family: sans-serif;
      font-size: 18px;
      margin-left: 8px;
      margin-right: 14px;
      transition: opacity 0.3s ease 0.1s;
    }

    .nav-item:hover .btn, button.nav-item:hover {
      max-width: 220px;
    }

    .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
      opacity: 1;
    }

    /* Login Card Styles */
    .login-card {
      width: 420px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid #117865;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(17, 120, 101, 0.25);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .login-card h2 {
      color: #f2c915;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-group label {
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.8;
    }

    .form-control-custom {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(242, 201, 21, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control-custom:focus {
      border-color: #117865;
      box-shadow: 0 0 10px rgba(17, 120, 101, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #117865;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: #15937c;
      color: #f2c915;
      box-shadow: 0 0 15px rgba(242, 201, 21, 0.3);
    }

    #error-msg {
      color: #ff4d4d;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar">
    <img src="logo.png" class="nav-logo" alt="logo">

    <a href="index.html" class="nav-item">
      <button class="btn">
        <img src="Home.ico" alt=".">
        <span class="btn-text">Home</span>
      </button>
    </a>

    <button class="btn nav-item" type="button">
      <img src="Dashboards+.ico" alt=".">
      <span class="btn-text" style="color: #117865;">Dashboards</span>
    </button>

    <a href="contact-us.html" class="nav-item">
      <button class="btn">
        <img src="message.ico" alt=".">
        <span class="btn-text">Contact us</span>
      </button>
    </a>
  </div>

  <div id="stage">
    <div class="login-card">
      <h2>Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control-custom" placeholder="Enter your username" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control-custom" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
        <div id="error-msg">Invalid Username or Password!</div>
      </form>
    </div>
  </div>

  <script>
    // ۱. بررسی وضعیت ورود به محض بالا آمدن صفحه
    const loggedInUser = sessionStorage.getItem("activeUser");
    if (loggedInUser === "saipapolos") {
      window.location.href = "saipa-polos-dashboard.html";
    }

    // Responsive Stage Scale
    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      navbar.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();

    // ۲. پردازش فرم ورود و ذخیره در sessionStorage
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      if (user === "saipapolos" && pass === "sp2026") {
        // ذخیره ورود در حافظه موقت زبانه جاری
        sessionStorage.setItem("activeUser", "saipapolos");
        
        // انتقال به صفحه اصلی
        window.location.href = "saipa-polos-dashboard.html";
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
