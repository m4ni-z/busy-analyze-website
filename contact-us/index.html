<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="../images/favicon.ico">
    <style>
        html, body{
            margin:0;
            padding:0;
            width:100%;
            background-color:black;
            overflow-x:hidden;
            transition: background-color 0.35s ease;
        }

        #stageWrapper{
            position:relative;
            width:100%;
        }

        #stage{
            position:absolute;
            top:0;
            left:0;
            width:1920px;
            transform-origin: top left;
            text-align:center;
        }

        /* Navbar Styles */
        #navbar {
          position: fixed;
          top: 0;
          left: 0;
          transform-origin: top left;
          z-index: 10;
          display: flex;
          align-items: center;
          background-color: rgba(0, 0, 0, 0.9);
          padding: 10px 20px;
          gap: 20px;
          transition: background-color 0.35s ease;
        }

        #navbar .nav-logo {
          height: 50px;
          width: auto;
          flex-shrink: 0;
        }

        .nav-item {
          text-decoration: none;
        }

        .nav-item .btn, .btn.nav-item {
          max-width: 40px;
          height: 50px;
          border-radius: 0;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          padding: 0;
          border: none;
          background-color: transparent;
          transition: max-width 0.4s ease;
          white-space: nowrap;
        }

        .nav-item .btn img, .btn.nav-item img {
          width: 38px;
          height: 38px;
          object-fit: contain;
          flex-shrink: 0;
          margin: 0;
        }

        .nav-item .btn-text, .btn.nav-item .btn-text {
          opacity: 0;
          color: #f2c915;
          font-family: sans-serif;
          font-size: 18px;
          margin-left: 8px;
          margin-right: 14px;
          transition: opacity 0.3s ease 0.1s;
        }

        .nav-item:hover .btn, button.nav-item:hover {
          max-width: 220px;
        }

        .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
          opacity: 1;
        }

        /* دکمه تغییر حالت روشن/تاریک - کاملاً مستقل، چسبیده به گوشه واقعی بالا-راستِ صفحه (اسکیل نمی‌شود) */
        #themeToggle {
          position: fixed;
          top: 15px;
          right: 20px;
          z-index: 11;
          width: 38px;
          height: 38px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          border: none;
          background-color: transparent;
          cursor: pointer;
          opacity: 0.85;
          transition: opacity 0.2s ease;
        }

        #themeToggle:hover {
          opacity: 1;
        }

        #themeToggle img {
          width: 38px;
          height: 38px;
          object-fit: contain;
          flex-shrink: 0;
          margin: 0;
        }

        h1{
            color:#F2C915;
            font-family:Verdana;
            font-size:300%;
        }
        .card-wrapper{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:36px;
            flex-wrap:wrap;
            padding:60px 0;
        }

        .social-card{
            width:225px;
            border:1px solid #e0e0e0;
            border-radius:21px;
            overflow:hidden;
            box-shadow:0 3px 9px rgba(255, 0, 0, 0.08);
            text-align:center;
            font-family:Tahoma, Arial, sans-serif;
        }
        .social-card .photo{
            width:100%;
            aspect-ratio:1/1;
            background:#000000;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        .social-card .photo img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .social-card .name{
            margin-top:15px;
            font-size:21px;
            font-weight:600;
            color:#222222;
        }
        .social-card .handle{
            margin-top:3px;
            font-size:16px;
            font-weight:400;
            color:black;
        }
        .social-card .open-btn{
            display:block;
            width:80%;
            margin:12px auto 18px auto;
            padding:7px 0;
            border:none;
            border-radius:24px;
            background:black;
            color:#ffffff;
            font-size:19px;
            font-weight:600;
            cursor:pointer;
            outline:none;
            box-shadow:none;
            text-decoration:none;
        }

        .social-card.telegram{
            background:#37AEE2;
        }
        .social-card.gmail{
            background:#00AC47;
        }

        /* حالت روشن (لایت مود) */
        html.light-mode,
        body.light-mode {
          background-color: #ffffff;
        }

        body.light-mode #navbar {
          background-color: rgba(255, 255, 255, 0.95);
          box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
        }
    </style>
  </head>
  <body>

    <!-- Navbar -->
    <div id="navbar">
      <img src="../images/logo.png" class="nav-logo" alt="logo">

      <a href="../" class="nav-item">
        <button class="btn">
          <img src="../images/Home.ico" alt=".">
          <span class="btn-text">Home</span>
        </button>
      </a>

      <a href="../sign-in" class="nav-item">
        <button class="btn">
          <img src="../images/Dashboards.ico" alt=".">
          <span class="btn-text">Dashboards</span>
        </button>
      </a>

      <button class="btn nav-item" type="button">
        <img src="../images/message+.ico" alt=".">
        <span class="btn-text" style="color: #117865;">Contact us</span>
      </button>
    </div>

    <button id="themeToggle" type="button">
      <img id="themeIcon" src="../images/sun.ico" alt=".">
    </button>

    <div id="stageWrapper">
    <div id="stage">
        <br><br><br><br><br><br><br><br>
        <div class="card-wrapper">

            <!--Telegram-->
            <div class="social-card telegram">
                <div class="photo">
                    <img style="width:135px; height:135px;" src="../images/telegram.ico" alt="Telegram">
                </div>
                <div class="name">Telegram</div>
                <div class="handle">@busyanalyze</div>
                <a class="open-btn" href="https://t.me/busyanalyze">Open</a>
            </div>

            <!--Gmail-->
            <div class="social-card gmail">
                <div class="photo">
                    <img style="width:150px; height:150px;" src="../images/gmail.ico" alt="Gmail">
                </div>
                <div class="name">Gmail</div>
                <div class="handle">busyanalyze@gmail.com</div>
                <a class="open-btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=busyanalyze@gmail.com">Send Email</a>
            </div>

        </div>
    </div>
    </div>

  <script>
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // اعمال حالت روشن یا تاریک
    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
        body.classList.add('light-mode');
        themeIcon.src = '../images/moon.ico';
      } else {
        document.documentElement.classList.remove('light-mode');
        body.classList.remove('light-mode');
        themeIcon.src = '../images/sun.ico';
      }
    }

    // خواندن حالت ذخیره‌شده از حافظه‌ی مرورگر (بین صفحات مختلف سایت مشترک است)
    const savedTheme = localStorage.getItem('busyanalyze-theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
      const isLight = body.classList.contains('light-mode');
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('busyanalyze-theme', newTheme);
      applyTheme(newTheme);
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const stageWrapper = document.getElementById('stageWrapper');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = window.innerWidth / BASE_WIDTH;
      stage.style.transform = `scale(${scale})`;

      stageWrapper.style.height = (stage.offsetHeight * scale) + 'px';

      // مقیاس نوبار مثل صفحات دیگر: هم عرض و هم ارتفاع پنجره لحاظ می‌شود
      const navbarScale = Math.min(window.innerWidth / BASE_WIDTH, window.innerHeight / BASE_HEIGHT);
      navbar.style.transform = `scale(${navbarScale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

  </body>
</html>
