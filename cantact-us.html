<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cantact us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="i.ico">
    <style>
        html, body{
            margin:0;
            padding:0;
            width:100%;
            background-color:black;
            overflow-x:hidden;
        }

        /* این wrapper فقط ارتفاع واقعی (بعد از اسکیل) استیج رو نگه می‌داره تا اسکرول صفحه درست باشه */
        #stageWrapper{
            position:relative;
            width:100%;
        }

        /* این div مرجع اصلی طرح است. عرض پایه دقیقا اندازه‌ی صفحه‌نمایش رفرنس فعلی است */
        #stage{
            position:absolute;
            top:0;
            left:0;
            width:1920px;
            transform-origin: top left;
            text-align:center;
        }

        h1{
            color:#F2C915;
            font-family:Verdana;
            font-size:300%;
        }
        .card-wrapper{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:24px;
            flex-wrap:wrap;
            padding:40px 0;
        }
        .social-card{
            width:150px;
            border:1px solid #e0e0e0;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0 2px 6px rgba(255, 0, 0, 0.08);
            text-align:center;
            font-family:Tahoma, Arial, sans-serif;
        }
        .social-card .photo{
            width:100%;
            aspect-ratio:1/1;
            background:#000000;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        .social-card .photo img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .social-card .name{
            margin-top:10px;
            font-size:14px;
            font-weight:600;
            color:#222222;
        }
        .social-card .handle{
            margin-top:2px;
            font-size:11px;
            font-weight:400;
            color:black;
        }
        .social-card .open-btn{
            display:block;
            width:80%;
            margin:8px auto 12px auto;
            padding:5px 0;
            border:none;
            border-radius:16px;
            background:black;
            color:#ffffff;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            outline:none;
            box-shadow:none;
            text-decoration:none;
        }

        .social-card.telegram{
            background:#37AEE2;
        }
        .social-card.gmail{
            background:#00AC47;
        }

        /* این دکمه عمدا بیرون از استیج قرار داره تا همیشه دقیقا به گوشه‌ی واقعی صفحه بچسبد،
           فارغ از اینکه استیج به‌خاطر اختلاف نسبت صفحه چقدر letterbox داره */
        #backBtn{
            position:fixed;
            bottom:0;
            left:0;
            transform-origin: bottom left;
            margin:1rem;
            z-index:10;
        }
    </style>
  </head>
  <body>

    <div id="stageWrapper">
    <div id="stage">
        <img src="logo.png" style="position: absolute; top: 5px; left: 10px; width: 150px;">
        <br><br><br>
        <h1>Cantact us</h1>
        <br><br><br><br><br><br><br><br>
        <div class="card-wrapper">

            <!--Telegram-->
            <div class="social-card telegram">
                <div class="photo">
                    <img style="width:90px; height:90px;" src="telegram.ico" alt="Telegram">
                </div>
                <div class="name">Telegram</div>
                <div class="handle">@busyanalyze</div>
                <a class="open-btn" href="https://t.me/busyanalyze">Open</a>
            </div>

            <!--Gmail-->
            <div class="social-card gmail">
                <div class="photo">
                    <img style="width:100px; height:100px;" src="gmail.ico" alt="Gmail">
                </div>
                <div class="name">Gmail</div>
                <div class="handle">busyanalyze@gmail.com</div>
                <a class="open-btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=busyanalyze@gmail.com">Send Email</a>
            </div>

        </div>
    </div>
    </div>

    <a href="index.html" id="backBtn">
    <button class="btn btn-dark p-1" style="width:50px; height:50px;">
    <img src="back.png" class="img-fluid" alt=".">
    </button>
  </a>

  <script>
    // اسکیل کردن کل صفحه فقط بر اساس عرض، تا هیچ فاصله‌ی خالی کنار طرح نیفتد
    // و همه‌چیز دقیقا با همون نسبت اصلی کوچیک یا بزرگ بشه
    const BASE_WIDTH = 1920;
    const stage = document.getElementById('stage');
    const stageWrapper = document.getElementById('stageWrapper');
    const backBtn = document.getElementById('backBtn');

    function resizeStage() {
      const scale = window.innerWidth / BASE_WIDTH;
      stage.style.transform = `scale(${scale})`;

      // ارتفاع واقعی wrapper رو برابر ارتفاع اسکیل‌شده استیج می‌کنیم تا اسکرول صفحه درست باشد
      stageWrapper.style.height = (stage.offsetHeight * scale) + 'px';

      // دکمه بازگشت مستقل از استیج اسکیل می‌شود اما همیشه دقیقا در گوشه واقعی صفحه می‌ماند
      backBtn.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

  </body>
</html>
