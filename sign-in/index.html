<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      font-family: sans-serif;
      overflow: hidden;
      transition: background-color 0.35s ease;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      z-index: 10;
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      gap: 20px;
      transition: background-color 0.35s ease;
    }

    #navbar .nav-logo {
      height: 50px;
      width: auto;
      flex-shrink: 0;
    }

    .nav-item {
      text-decoration: none;
    }

    .nav-item .btn, .btn.nav-item {
      max-width: 40px;
      height: 50px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: none;
      background-color: transparent;
      transition: max-width 0.4s ease;
      white-space: nowrap;
    }

    .nav-item .btn img, .btn.nav-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .nav-item .btn-text, .btn.nav-item .btn-text {
      opacity: 0;
      color: #f2c915;
      font-family: sans-serif;
      font-size: 18px;
      margin-left: 8px;
      margin-right: 14px;
      transition: opacity 0.3s ease 0.1s;
    }

    .nav-item:hover .btn, button.nav-item:hover {
      max-width: 220px;
    }

    .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
      opacity: 1;
    }

    /* دکمه تغییر حالت روشن/تاریک - کاملاً مستقل، چسبیده به گوشه واقعی بالا-راستِ صفحه (اسکیل نمی‌شود) */
    #themeToggle {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 11;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background-color: transparent;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    #themeToggle:hover {
      opacity: 1;
    }

    #themeToggle img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .login-card {
      width: 420px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid #117865;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(17, 120, 101, 0.25);
      backdrop-filter: blur(10px);
      text-align: center;
      transition: background-color 0.35s ease, box-shadow 0.35s ease;
    }

    .login-card h2 {
      color: #f2c915;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-group label {
      color: #ffffff;
      font-size: 14px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.8;
      transition: color 0.35s ease;
    }

    .form-control-custom {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(242, 201, 21, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control-custom:focus {
      border-color: #117865;
      box-shadow: 0 0 10px rgba(17, 120, 101, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #117865;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: #15937c;
      color: #f2c915;
      box-shadow: 0 0 15px rgba(242, 201, 21, 0.3);
    }

    #error-msg {
      color: #ff4d4d;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }

    /* حالت روشن (لایت مود) - فقط پس‌زمینه و متن‌های سفید؛ زرد و سبز دست‌نخورده می‌مانند */
    body.light-mode,
    body.light-mode #stage {
      background-color: #f7f9f8;
    }

    body.light-mode #navbar {
      background-color: rgba(247, 249, 248, 0.95);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }

    body.light-mode .login-card {
      background: #ffffff;
      border-color: rgba(17, 120, 101, 0.08);
      box-shadow: 0 14px 42px rgba(17, 120, 101, 0.22);
    }

    body.light-mode .form-group label {
      color: #1a1a1a;
    }

    body.light-mode .form-control-custom {
      background: rgba(0, 0, 0, 0.04);
      color: #1a1a1a;
    }

    body.light-mode .form-control-custom::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }

    body.light-mode .form-control-custom:focus {
      background: rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>

  <div id="navbar">
    <img src="../images/logo.png" class="nav-logo" alt="logo">

    <a href="../" class="nav-item">
      <button class="btn">
        <img src="../images/Home.ico" alt=".">
        <span class="btn-text">Home</span>
      </button>
    </a>

    <button class="btn nav-item" type="button">
      <img src="../images/Dashboards+.ico" alt=".">
      <span class="btn-text" style="color: #117865;">Dashboards</span>
    </button>

    <a href="../contact-us" class="nav-item">
      <button class="btn">
        <img src="../images/message.ico" alt=".">
        <span class="btn-text">Contact us</span>
      </button>
    </a>
  </div>

  <button id="themeToggle" type="button">
    <img id="themeIcon" src="../images/sun.ico" alt=".">
  </button>

  <div id="stage">
    <div class="login-card">
      <h2>Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control-custom" placeholder="Enter your username" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control-custom" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
        <div id="error-msg">Invalid Username or Password!</div>
      </form>
    </div>
  </div>

  <script>
    const loggedInUser = localStorage.getItem("activeUser");
    if (loggedInUser === "saipapolos") {
      window.location.href = "../saipa-polos-dashboard";
    } else if (loggedInUser === "administrator") {
      window.location.href = "../administrator-dashboard";
    } else if (loggedInUser === "GFK") {
      window.location.href = "../ghaem-faraz-kousha-dashboard";
    }

    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // اعمال حالت روشن یا تاریک
    function applyTheme(theme) {
      if (theme === 'light') {
        body.classList.add('light-mode');
        themeIcon.src = '../images/moon.ico';
      } else {
        body.classList.remove('light-mode');
        themeIcon.src = '../images/sun.ico';
      }
    }

    // خواندن حالت ذخیره‌شده از حافظه‌ی مرورگر (بین صفحات مختلف سایت مشترک است)
    const savedTheme = localStorage.getItem('busyanalyze-theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
      const isLight = body.classList.contains('light-mode');
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('busyanalyze-theme', newTheme);
      applyTheme(newTheme);
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      navbar.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      if (user === "saipapolos" && pass === "sp2026") {
        localStorage.setItem("activeUser", "saipapolos");
        
        window.location.href = "../saipa-polos-dashboard";
      } else if (user === "administrator" && pass === "Busy2026") {
        localStorage.setItem("activeUser", "administrator");
        
        window.location.href = "../administrator-dashboard";
      } else if (user === "GFK" && pass === "gfk2026") {
        localStorage.setItem("activeUser", "GFK");

        window.location.href = "../ghaem-faraz-kousha-dashboard";
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
