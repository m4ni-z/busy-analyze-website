<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busy Analyze</title>
  <link rel="icon" href="images/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
      transition: background-color 0.35s ease;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #logoVideo,
    #logoImage {
      transform: scale(.5);
    }

    #logoImage {
      display: none;
      object-fit: contain;
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      z-index: 10;
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      gap: 20px;
      transition: background-color 0.35s ease;
    }

    #navbar .nav-logo {
      height: 50px;
      width: auto;
      flex-shrink: 0;
    }

    .nav-item {
      text-decoration: none;
    }

    .nav-item .btn, .btn.nav-item {
      max-width: 40px;
      height: 50px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: none;
      background-color: transparent;
      transition: max-width 0.4s ease;
      white-space: nowrap;
    }

    .nav-item .btn img, .btn.nav-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .nav-item .btn-text, .btn.nav-item .btn-text {
      opacity: 0;
      color: #f2c915;
      font-family: sans-serif;
      font-size: 18px;
      margin-left: 8px;
      margin-right: 14px;
      transition: opacity 0.3s ease 0.1s;
    }

    .nav-item:hover .btn, button.nav-item:hover {
      max-width: 220px;
    }

    .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
      opacity: 1;
    }

    /* دکمه تغییر حالت روشن/تاریک - کاملاً مستقل، چسبیده به گوشه واقعی بالا-راستِ صفحه (اسکیل نمی‌شود) */
    #themeToggle {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 11;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background-color: transparent;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    #themeToggle:hover {
      opacity: 1;
    }

    #themeToggle img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    #credit {
      position: fixed;
      bottom: 0;
      right: 0;
      transform-origin: bottom right;
      margin: 0.6rem;
      font-family: sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 10;
      letter-spacing: 0.5px;
      transition: color 0.35s ease;
    }

    /* حالت روشن (لایت مود) */
    body.light-mode,
    body.light-mode #stage {
      background-color: #ffffff;
    }

    body.light-mode #navbar {
      background-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }

    body.light-mode #credit {
      color: rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>

  <div id="stage">

    <video id="logoVideo" src="images/logo.mp4" autoplay muted playsinline></video>
    <img id="logoImage" src="images/logo.png" alt="logo">

  </div>

  <div id="navbar">
    <img src="images/logo.png" class="nav-logo" alt="logo">

    <button class="btn nav-item" type="button">
      <img src="images/Home+.ico" alt=".">
      <span class="btn-text" style="color: #117865;">Home</span>
    </button>

    <a href="sign-in" class="nav-item">
      <button class="btn">
        <img src="images/Dashboards.ico" alt=".">
        <span class="btn-text">Dashboards</span>
      </button>
    </a>

    <a href="contact-us" class="nav-item">
      <button class="btn">
        <img src="images/message.ico" alt=".">
        <span class="btn-text">Contact us</span>
      </button>
    </a>
  </div>

  <button id="themeToggle" type="button">
    <img id="themeIcon" src="images/sun.ico" alt=".">
  </button>

  <div id="credit">Made by Mani</div>

  <script>
    const video = document.getElementById('logoVideo');
    const logoImage = document.getElementById('logoImage');
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // اندازه‌ی لوگوی جایگزین (logo.ico) دقیقا برابر اندازه‌ی ویدیو (logo.mp4) تنظیم می‌شود
    function syncLogoImageSize() {
      const w = video.videoWidth || video.offsetWidth;
      const h = video.videoHeight || video.offsetHeight;
      if (w && h) {
        logoImage.style.width = w + 'px';
        logoImage.style.height = h + 'px';
      }
    }

    video.addEventListener('loadedmetadata', syncLogoImageSize);
    window.addEventListener('resize', syncLogoImageSize);

    video.addEventListener('ended', function () {
      video.pause();
    });

    video.play().catch(function () {
      document.addEventListener('click', function () {
        video.play();
      }, { once: true });
    });

    // اعمال حالت روشن یا تاریک
    function applyTheme(theme) {
      if (theme === 'light') {
        body.classList.add('light-mode');
        video.style.display = 'none';
        logoImage.style.display = 'block';
        syncLogoImageSize();
        video.pause();
        themeIcon.src = 'images/moon.ico';
      } else {
        body.classList.remove('light-mode');
        logoImage.style.display = 'none';
        video.style.display = 'block';
        video.play().catch(function () {});
        themeIcon.src = 'images/sun.ico';
      }
    }

    // خواندن حالت ذخیره‌شده از حافظه‌ی مرورگر (بین صفحات مختلف سایت مشترک است)
    const savedTheme = localStorage.getItem('busyanalyze-theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
      const isLight = body.classList.contains('light-mode');
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('busyanalyze-theme', newTheme);
      applyTheme(newTheme);
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      navbar.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

</body>
</html>
