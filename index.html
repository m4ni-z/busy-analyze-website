<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busy Analyze</title>
  <link rel="icon" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .text {
      font-family: sans-serif;
      font-size: 40px;
      color: #ffffff;
      display: flex;
      align-items: center;
      margin-top: 20px;
    }
    .dot {
      display: inline-block;
      animation: bounce 1.2s infinite;
      margin-left: 6px;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }

    #msgBtn {
      position: fixed;
      bottom: 0;
      left: 0;
      transform-origin: bottom left;
      margin: 1rem;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="stage">

    <video id="logoVideo" src="logo.mp4" autoplay muted playsinline style="transform: scale(.5);"></video>

    <div class="text">
      Coming Soon
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>

  </div>

  <a href="cantact-us.html" id="msgBtn">
      <button class="btn btn-dark p-1" style="width:50px; height:50px;">
    <img src="message.png" class="img-fluid" alt=".">
    </button>
  </a>

  <script>
    const video = document.getElementById('logoVideo');

    video.addEventListener('ended', function () {
      video.pause();
    });

    video.play().catch(function () {
      document.addEventListener('click', function () {
        video.play();
      }, { once: true });
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const msgBtn = document.getElementById('msgBtn');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      msgBtn.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

</body>
</html>
