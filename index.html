<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busy Analyze</title>
  <link rel="icon" href="images/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
      transition: background-color 0.35s ease;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #logoVideo,
    #logoImage {
      transform: scale(.5);
    }

    #logoImage {
      display: none;
      object-fit: contain;
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      z-index: 10;
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      gap: 20px;
      transition: background-color 0.35s ease;
    }

    #navbar .nav-logo {
      height: 50px;
      width: auto;
      flex-shrink: 0;
    }

    .nav-item {
      text-decoration: none;
    }

    .nav-item .btn, .btn.nav-item {
      max-width: 40px;
      height: 50px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: none;
      background-color: transparent;
      transition: max-width 0.4s ease;
      white-space: nowrap;
    }

    .nav-item .btn img, .btn.nav-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .nav-item .btn-text, .btn.nav-item .btn-text {
      opacity: 0;
      color: #f2c915;
      font-family: sans-serif;
      font-size: 18px;
      margin-left: 8px;
      margin-right: 14px;
      transition: opacity 0.3s ease 0.1s;
    }

    .nav-item:hover .btn, button.nav-item:hover {
      max-width: 220px;
    }

    .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
      opacity: 1;
    }

    #themeToggle {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 11;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background-color: transparent;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    #themeToggle:hover {
      opacity: 1;
    }

    #themeToggle img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    #credit {
      position: fixed;
      bottom: 0;
      right: 0;
      transform-origin: bottom right;
      margin: 0.6rem;
      font-family: sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 10;
      letter-spacing: 0.5px;
      transition: color 0.35s ease;
    }

    body.light-mode,
    body.light-mode #stage {
      background-color: #ffffff;
    }

    body.light-mode #navbar {
      background-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
    }

    body.light-mode #credit {
      color: rgba(0, 0, 0, 0.55);
    }

    /* Mobile Restriction Screen Styles */
    #mobileScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    .mobile-card {
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #117865;
      border-radius: 16px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .mobile-logo {
      height: 55px;
      width: auto;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .mobile-icon-box {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: rgba(17, 120, 101, 0.15);
      border: 1px solid #117865;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #f2c915;
    }

    .mobile-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .mobile-text {
      color: #b0b0b0;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .mobile-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      background-color: rgba(242, 201, 21, 0.1);
      border: 1px solid #f2c915;
      color: #f2c915;
      font-size: 12px;
      font-weight: 500;
    }

    .mobile-badge-dot {
      width: 6px;
      height: 6px;
      background-color: #117865;
      border-radius: 50%;
    }

    /* Desktop Fullscreen Request Overlay */
    #fullscreenOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .fullscreen-msg {
      color: #ffffff;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Mobile Restriction Screen -->
  <div id="mobileScreen">
    <div class="mobile-card">
      <img src="images/logo.png" alt="logo" class="mobile-logo">
      <div class="mobile-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div class="mobile-title">Desktop Required</div>
      <div class="mobile-text">
        To use this website, please access it from a computer.
      </div>
      <div class="mobile-badge">
        <span class="mobile-badge-dot"></span>
        Computer / Laptop Only
      </div>
    </div>
  </div>

  <!-- Desktop Small Screen Overlay -->
  <div id="fullscreenOverlay">
    <div class="fullscreen-msg">Please make the page full screen to use the site.</div>
  </div>

  <div id="stage">

    <video id="logoVideo" src="images/logo.mp4" autoplay muted playsinline></video>
    <img id="logoImage" src="images/logo.png" alt="logo">

  </div>

  <div id="navbar">
    <img src="images/logo.png" class="nav-logo" alt="logo">

    <button class="btn nav-item" type="button">
      <img src="images/Home+.ico" alt=".">
      <span class="btn-text" style="color: #117865;">Home</span>
    </button>

    <a href="sign-in" class="nav-item">
      <button class="btn">
        <img src="images/Dashboards.ico" alt=".">
        <span class="btn-text">Dashboards</span>
      </button>
    </a>

    <a href="contact-us" class="nav-item">
      <button class="btn">
        <img src="images/message.ico" alt=".">
        <span class="btn-text">Contact us</span>
      </button>
    </a>
  </div>

  <button id="themeToggle" type="button">
    <img id="themeIcon" src="images/sun.ico" alt=".">
  </button>

  <div id="credit">Made by Mani</div>

  <script>
    function isMobilePhone() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // Check if device is a tablet
      const isTablet = /(ipad|tablet|playbook|silk)|(android(?!.*mobi))/i.test(userAgent);
      if (isTablet) return false;

      // Check for phone user agents or small screens with touch
      const isPhoneUA = /Android.*Mobile|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
      const isSmallTouch = (('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 768);

      return isPhoneUA || isSmallTouch;
    }

    const isMobile = isMobilePhone();

    if (isMobile) {
      document.getElementById('mobileScreen').style.display = 'flex';
      document.getElementById('stage').style.display = 'none';
      document.getElementById('navbar').style.display = 'none';
      document.getElementById('themeToggle').style.display = 'none';
      document.getElementById('credit').style.display = 'none';
    }

    function checkDesktopSize() {
      if (!isMobile) {
        const overlay = document.getElementById('fullscreenOverlay');
        if (window.innerWidth < 1200 || window.innerHeight < 650) {
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
        }
      }
    }

    window.addEventListener('resize', checkDesktopSize);
    checkDesktopSize();

    const video = document.getElementById('logoVideo');
    const logoImage = document.getElementById('logoImage');
    const body = document.body;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function syncLogoImageSize() {
      const w = video.videoWidth || video.offsetWidth;
      const h = video.videoHeight || video.offsetHeight;
      if (w && h) {
        logoImage.style.width = w + 'px';
        logoImage.style.height = h + 'px';
      }
    }

    video.addEventListener('loadedmetadata', syncLogoImageSize);
    window.addEventListener('resize', syncLogoImageSize);

    video.addEventListener('ended', function () {
      video.pause();
    });

    video.play().catch(function () {
      document.addEventListener('click', function () {
        video.play();
      }, { once: true });
    });

    function applyTheme(theme) {
      if (theme === 'light') {
        body.classList.add('light-mode');
        video.style.display = 'none';
        logoImage.style.display = 'block';
        syncLogoImageSize();
        video.pause();
        themeIcon.src = 'images/moon.ico';
      } else {
        body.classList.remove('light-mode');
        logoImage.style.display = 'none';
        video.style.display = 'block';
        video.play().catch(function () {});
        themeIcon.src = 'images/sun.ico';
      }
    }

    const savedTheme = localStorage.getItem('busyanalyze-theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
      const isLight = body.classList.contains('light-mode');
      const newTheme = isLight ? 'dark' : 'light';
      localStorage.setItem('busyanalyze-theme', newTheme);
      applyTheme(newTheme);
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      navbar.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

</body>
</html>
