<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busy Analyze</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: top left;
      z-index: 10;
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      gap: 20px;
    }

    #navbar .nav-logo {
      height: 50px;
      width: auto;
      flex-shrink: 0;
    }

    .nav-item {
      text-decoration: none;
    }

    .nav-item .btn, .btn.nav-item {
      max-width: 40px;
      height: 50px;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      border: none;
      background-color: transparent;
      transition: max-width 0.4s ease;
      white-space: nowrap;
    }

    .nav-item .btn img, .btn.nav-item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0;
    }

    .nav-item .btn-text, .btn.nav-item .btn-text {
      opacity: 0;
      color: #f2c915;
      font-family: sans-serif;
      font-size: 18px;
      margin-left: 8px;
      margin-right: 14px;
      transition: opacity 0.3s ease 0.1s;
    }

    .nav-item:hover .btn, button.nav-item:hover {
      max-width: 220px;
    }

    .nav-item:hover .btn-text, button.nav-item:hover .btn-text {
      opacity: 1;
    }

    #credit {
      position: fixed;
      bottom: 0;
      right: 0;
      transform-origin: bottom right;
      margin: 0.6rem;
      font-family: sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 10;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="stage">

    <video id="logoVideo" src="logo.mp4" autoplay muted playsinline style="transform: scale(.5);"></video>

  </div>

  <div id="navbar">
    <img src="logo.png" class="nav-logo" alt="logo">

    <button class="btn nav-item" type="button">
      <img src="Home+.ico" alt=".">
      <span class="btn-text" style="color: #117865;">Home</span>
    </button>

    <a href="sign-in.html" class="nav-item">
      <button class="btn">
        <img src="Dashboards.ico" alt=".">
        <span class="btn-text">Dashboards</span>
      </button>
    </a>

    <a href="contact-us.html" class="nav-item">
      <button class="btn">
        <img src="message.ico" alt=".">
        <span class="btn-text">Contact us</span>
      </button>
    </a>
  </div>

  <div id="credit">Made by Mani</div>

  <script>
    const video = document.getElementById('logoVideo');

    video.addEventListener('ended', function () {
      video.pause();
    });

    video.play().catch(function () {
      document.addEventListener('click', function () {
        video.play();
      }, { once: true });
    });

    const BASE_WIDTH = 1920;
    const BASE_HEIGHT = 1080;
    const stage = document.getElementById('stage');
    const navbar = document.getElementById('navbar');

    function resizeStage() {
      const scale = Math.min(
        window.innerWidth / BASE_WIDTH,
        window.innerHeight / BASE_HEIGHT
      );
      stage.style.transform = `scale(${scale})`;
      stage.style.left = (window.innerWidth - BASE_WIDTH * scale) / 2 + 'px';
      stage.style.top = (window.innerHeight - BASE_HEIGHT * scale) / 2 + 'px';

      navbar.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeStage);
    resizeStage();
  </script>

</body>
</html>
