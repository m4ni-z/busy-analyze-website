<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title>
<link rel="icon" href="../images/favicon.ico">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background-color: black;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

h1 {
  color: #f2c915;
  font-size: 90px;
  margin: 0;
}

.coming-soon {
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  margin-top: 6px;
  letter-spacing: 1px;
}

.back-link {
  display: inline-block;
  margin-top: 30px;
  color: #117865;
  font-size: 16px;
  text-decoration: none;
  cursor: pointer;
}

.back-link:hover {
  color: #15937c;
}
</style>
</head>
<body>

<div>
  <h1>404</h1>
  <div class="coming-soon">Coming soon</div>
  <a href="../sign-in" class="back-link" id="backLink">Back</a>
</div>

<script>
document.getElementById('backLink').addEventListener('click', function (e) {
  e.preventDefault();
  try {
    localStorage.clear();
    sessionStorage.clear();
  } catch (err) {
    console.error('Error clearing storage:', err);
  }
  window.location.href = '../sign-in';
});
</script>

</body>
</html>
